# PROPOSTO / NAO IMPLEMENTADO: desenho de referencia para a telemetria de
# veiculos conectados do ForwardService (Cybersecurity Sprint 3, secao 2.6).
# Nao existe broker em producao; este arquivo documenta a configuracao alvo
# (Eclipse Mosquitto 2.x) e pode ser usado para um laboratorio local.
#
# Principios: sem porta 1883 em texto claro, sem cliente anonimo, TLS 1.2+
# com autenticacao mutua (mTLS) por certificado X.509 unico por veiculo,
# identidade do certificado = usuario MQTT, ACL por topico e limites de
# tamanho/fila contra abuso.

per_listener_settings true

# ---------------------------------------------------------------------------
# Listener publico para as TCUs dos veiculos (MQTT sobre TLS, porta 8883)
# ---------------------------------------------------------------------------
listener 8883
protocol mqtt

# Cadeia da PKI de dispositivos (CA intermediaria dedicada a veiculos)
cafile /mosquitto/certs/fwd-device-ca-chain.pem
certfile /mosquitto/certs/broker.fwd-telemetry.crt
keyfile /mosquitto/certs/broker.fwd-telemetry.key
crlfile /mosquitto/certs/fwd-device-ca.crl

# TLS 1.2 como versao minima; 1.3 negociado quando o cliente suporta
tls_version tlsv1.2
ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305
ciphers_tls1.3 TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256

# mTLS obrigatorio: sem certificado valido nao ha CONNECT
require_certificate true
# O CN do certificado (device_id pseudonimo, ex.: dev-7f3a91c2) vira o usuario MQTT;
# a ACL usa %u para prender cada veiculo ao proprio topico.
use_identity_as_username true
allow_anonymous false
acl_file /mosquitto/config/acl

# Limites contra abuso / DoS
max_packet_size 16384
max_inflight_messages 20
max_queued_messages 500
max_connections 20000
persistent_client_expiration 7d

# ---------------------------------------------------------------------------
# Listener interno para o servico de ingestao (rede privada, tambem mTLS)
# ---------------------------------------------------------------------------
listener 8884 10.20.0.10
protocol mqtt
cafile /mosquitto/certs/fwd-service-ca-chain.pem
certfile /mosquitto/certs/broker.internal.crt
keyfile /mosquitto/certs/broker.internal.key
tls_version tlsv1.2
require_certificate true
use_identity_as_username true
allow_anonymous false
acl_file /mosquitto/config/acl

# ---------------------------------------------------------------------------
# Persistencia e logs (sem payload em log: telemetria e dado pessoal)
# ---------------------------------------------------------------------------
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
